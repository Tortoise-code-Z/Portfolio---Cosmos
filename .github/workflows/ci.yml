name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # URL pública para el build (canónica, OG). En Vercel se define por entorno.
  VITE_SITE_URL: https://cosmos-portfolio-two.vercel.app

jobs:
  quality:
    name: Typecheck · lint · format · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Variantes de las capturas (vite-imagetools): sin la caché, el build tarda alrededor de un minuto más.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/imagetools
          key: imagetools-${{ hashFiles('src/assets/**', 'vite.config.ts', 'package-lock.json') }}
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 7

  e2e:
    name: E2E (Chromium · Firefox · WebKit)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build/
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Regresión visual (Docker) y Lighthouse CI se añaden en F3 y F6 (docs/06-roadmap/roadmap.md).
