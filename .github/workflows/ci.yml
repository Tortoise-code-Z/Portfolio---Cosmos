name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # URL pública para el build (canónica, OG). En Vercel se define por entorno.
  VITE_SITE_URL: https://tortoisecode.dev

jobs:
  quality:
    name: Typecheck · lint · format · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      # Aviso, no bloqueo (docs/05-tecnico/git-y-despliegue.md → «Seguridad»): las dependencias que van al sitio, con
      # vulnerabilidades altas o críticas. Sin `--omit=dev`, las herramientas (Lighthouse CI en F6) avisarían siempre.
      - name: npm audit (warning)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Variantes de las capturas (vite-imagetools): sin la caché, el build tarda alrededor de un minuto más.
      # Si la clave cambia, se parte de la última caché: imagetools guarda cada variante por imagen y
      # directivas, así que no sirve una vieja; solo se generan las que falten.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/imagetools
          key: imagetools-${{ hashFiles('src/assets/**', 'src/content/imageWidths.ts', 'vite.config.ts', 'package-lock.json') }}
          restore-keys: imagetools-
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 7

  # Un job por navegador, en paralelo, dentro de la imagen oficial de Playwright (ADR-010): los navegadores y sus
  # dependencias del sistema ya vienen instalados, sin la descarga que colgaba el CI. La imagen va siempre a la
  # misma versión que `@playwright/test` (docs/05-tecnico/stack.md).
  e2e:
    name: E2E · ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      # El usuario del runner: así el checkout y la caché de npm no quedan como root.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build/
      - run: npm run e2e -- --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # Regresión visual (calidad.md → «Regresión visual»): las capturas de referencia salen de esta misma imagen
  # (`npm run visual:update` en Docker), así que se comparan píxel a píxel. Sin reintentos: una diferencia no es
  # pasajera. Si falla, el informe trae la referencia, la captura nueva y la diferencia.
  visual:
    name: Visual regression
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build/
      - run: npm run visual:run
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7

  # Uno de los checks obligatorios de `main` (git-y-despliegue.md): resume los tres navegadores con el
  # nombre de siempre, así la regla no cambia aunque los e2e vayan en paralelo.
  e2e-result:
    name: E2E (Chromium · Firefox · WebKit)
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar los tres navegadores
        run: test "${{ needs.e2e.result }}" = "success"

  # Lighthouse CI se añade en F6 (docs/06-roadmap/roadmap.md).
