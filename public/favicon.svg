<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon · «Constelación tortuga» (docs/03-diseno/design-system.md → «Logotipo y favicon»): estrellas unidas por
    líneas, como la galaxia de skills, que dibujan una tortuga vista desde arriba con la singularidad en el centro del
    caparazón. Colores de tokens.css: color-void, color-star, color-aurora y blanco (sin sus dos guiones: un
    comentario XML no puede llevarlos y el SVG dejaría de leerse como imagen). Los iconos PNG salen de aquí
    (`npm run og`); la clase `tile` deja a `apple-touch-icon` quitar las esquinas (iOS ya las redondea).
  -->
  <rect class="tile" width="32" height="32" rx="7" fill="#04050b" />
  <g fill="none" stroke="#62e8cf" stroke-width="1.4" stroke-opacity="0.75">
    <polyline points="16,5 16,10" />
    <polygon points="16,10 21,13 21,19 16,22 11,19 11,13" />
    <line x1="11" y1="13" x2="7" y2="9" />
    <line x1="21" y1="13" x2="25" y2="9" />
    <line x1="11" y1="19" x2="7" y2="24" />
    <line x1="21" y1="19" x2="25" y2="24" />
    <line x1="16" y1="22" x2="16" y2="27" />
  </g>
  <g fill="#ffc46b">
    <circle cx="16" cy="5" r="2" />
    <circle cx="16" cy="10" r="1.6" />
    <circle cx="21" cy="13" r="1.6" />
    <circle cx="21" cy="19" r="1.6" />
    <circle cx="16" cy="22" r="1.6" />
    <circle cx="11" cy="19" r="1.6" />
    <circle cx="11" cy="13" r="1.6" />
    <circle cx="7" cy="9" r="1.4" />
    <circle cx="25" cy="9" r="1.4" />
    <circle cx="7" cy="24" r="1.4" />
    <circle cx="25" cy="24" r="1.4" />
    <circle cx="16" cy="27" r="1.2" />
  </g>
  <circle cx="16" cy="16" r="1.5" fill="#ffffff" />
</svg>
